[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent-service"
version = "0.1.0"
description = "PPT generation microservice prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["service*"]
exclude = ["tests*", "refrences*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


name: diego

services:
  diego-service:
    image: diego-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diego-service
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DIEGO_RUN_STORE: "postgres"
      DIEGO_DATABASE_URL: "postgresql://postgres:postgres@diego-postgres:5432/diego"
    ports:
      - "8000:8000"
    depends_on:
      diego-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - diego-runtime:/app/.runtime

  diego-postgres:
    image: postgres:16-alpine
    container_name: diego-postgres
    environment:
      POSTGRES_DB: diego
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diego"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - diego-postgres-data:/var/lib/postgresql/data

volumes:
  diego-runtime:
  diego-postgres-data:

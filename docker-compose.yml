name: diego

services:
  diego-service:
    image: diego-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diego-service
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
